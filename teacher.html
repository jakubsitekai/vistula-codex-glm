<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teacher Panel - Vistula Quiz</title><link rel="stylesheet" href="assets/styles.css"></head><body><header><h1>Teacher Panel</h1><div id="user-info" class="hidden"><span id="user-name"></span><button id="logout-btn" class="btn-small">Logout</button></div><nav aria-label="Widok aplikacji"><a href="index.html">Widok studenta</a></nav></header><main><section id="teacher-login"><div class="card"><h2>Teacher Sign In</h2><p>Only authorized teachers and assistants can access this panel.</p><button id="github-login-btn" class="btn-primary">Sign in with GitHub</button><div class="divider">or</div><form id="email-login-form"><input type="email" id="email-input" placeholder="Email" required><input type="password" id="password-input" placeholder="Password" required><button type="submit" class="btn-primary">Sign in</button></form></div></section><section id="teacher-dashboard" class="hidden"><div class="card"><h2>Create Quiz Session</h2><form id="create-quiz-form"><label>Quiz title: <input type="text" id="quiz-title" required></label><label>Description: <input type="text" id="quiz-desc"></label><label>Number of questions: <input type="number" id="quiz-count" value="10" min="1" max="50" required></label><label>Time limit (minutes, 0 = no limit): <input type="number" id="quiz-time" value="0" min="0"></label><label>Mode:
            <select id="quiz-mode"><option value="practice">Practice / Open-book</option><option value="assessment">Assessment / Closed-book</option></select></label><label><input type="checkbox" id="quiz-show-results" checked> Show results immediately</label><label><input type="checkbox" id="quiz-multiple-attempts"> Allow multiple attempts</label><label>Access code (optional): <input type="text" id="quiz-access-code" placeholder="e.g. ABC123"></label><button type="submit" class="btn-primary">Create Session</button></form></div><div class="card"><h2>Active Sessions</h2><div id="sessions-list">Loading...</div></div><div class="card"><h2>Results</h2><div id="results-container"><p>Select a session to view results.</p></div><button id="export-csv-btn" class="btn-secondary hidden">Export CSV</button></div></section></main><footer><p><a href="index.html">Back to Student View</a></p></footer><script defer src="assets/teacher.js"></script></body></html>
